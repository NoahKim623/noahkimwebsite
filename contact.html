<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a;
    --accent: #d4f23a;       
    --accent-2: #6ee787;    
    --green: #3fdb6a;        
    --text: #ececec;
    --text-dim: #c4c4c4;
    --border: rgba(255, 255, 255, 0.16);
    --border-focus: var(--accent);
    --field-bg: rgba(255, 255, 255, 0.015);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 5vw, 5rem) clamp(1.25rem, 6vw, 7rem);
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* atmospheric glow behind the content */
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    right: -10%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(212, 242, 58, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    bottom: -25%;
    left: -10%;
    width: 55vw;
    height: 55vw;
    background: radial-gradient(circle, rgba(63, 219, 106, 0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    width: 100%;
    max-width: 1280px;
    position: relative;
    z-index: 1;
  }

  /* ---------- heading ---------- */
  h1 {
    font-family: "JetBrains Mono", monospace;
    font-weight: 800;
    color: var(--accent);
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: 0.04em;
    margin-bottom: clamp(2rem, 5vw, 3.5rem);
    display: flex;
    align-items: center;
    gap: 0.5em;
    opacity: 0;
    animation: rise 0.7s ease forwards;
  }
  h1 .brace {
    color: var(--accent-2);
    font-weight: 500;
  }

  /* ---------- grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(2.5rem, 6vw, 6rem);
    align-items: start;
  }

  /* ---------- left: info ---------- */
  .info { max-width: 460px; }

  .info h2 {
    color: var(--green);
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    margin-bottom: 0.6rem;
    opacity: 0;
    animation: rise 0.7s ease 0.1s forwards;
  }
  .info p.lead {
    color: var(--text);
    font-size: clamp(1rem, 1.4vw, 1.15rem);
    margin-bottom: 2.4rem;
    opacity: 0;
    animation: rise 0.7s ease 0.18s forwards;
  }

  .links { display: flex; flex-direction: column; gap: 1.35rem; }

  .links a {
    display: flex;
    align-items: center;
    gap: 1rem;
    color: var(--text);
    text-decoration: none;
    font-size: 1.1rem;
    width: fit-content;
    transition: color 0.2s ease, transform 0.2s ease;
    opacity: 0;
    animation: rise 0.6s ease forwards;
  }
  .links a:nth-child(1) { animation-delay: 0.26s; }
  .links a:nth-child(2) { animation-delay: 0.34s; }
  .links a:nth-child(3) { animation-delay: 0.42s; }
  .links a:nth-child(4) { animation-delay: 0.50s; }

  .links a:hover { color: var(--accent); transform: translateX(4px); }

  .links .icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    color: #fff;
    transition: color 0.2s ease;
  }
  .links a:hover .icon { color: var(--accent); }
  .links .icon svg { width: 100%; height: 100%; }

  /* ---------- right: form ---------- */
  form { display: flex; flex-direction: column; gap: 1.4rem; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    opacity: 0;
    animation: rise 0.6s ease forwards;
  }
  .field:nth-of-type(1) { animation-delay: 0.2s; }
  .field:nth-of-type(2) { animation-delay: 0.28s; }
  .field:nth-of-type(3) { animation-delay: 0.36s; }

  label {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--text);
  }

  input, textarea {
    font-family: "Poppins", sans-serif;
    font-size: 1rem;
    color: var(--text);
    background: var(--field-bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    width: 100%;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    resize: vertical;
  }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.28); }
  textarea { min-height: 130px; line-height: 1.5; }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(212, 242, 58, 0.14);
    background: rgba(255,255,255,0.03);
  }

  button {
    font-family: "Poppins", sans-serif;
    margin-top: 0.6rem;
    background: var(--accent);
    color: #0a0a0a;
    font-size: 1.2rem;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    padding: 0.95rem 1rem;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    opacity: 0;
    animation: rise 0.6s ease 0.44s forwards;
  }
  button:hover {
    filter: brightness(1.05);
    box-shadow: 0 8px 26px rgba(212, 242, 58, 0.25);
    transform: translateY(-2px);
  }
  button:active { transform: translateY(0); }

  .form-note {
    font-size: 0.85rem;
    color: var(--text-dim);
    min-height: 1.1rem;
    margin-top: -0.3rem;
  }
  .form-note.show { color: var(--green); }

  /* ---------- animations ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 820px) {
    body { align-items: flex-start; }
    .grid { grid-template-columns: 1fr; gap: 3rem; }
    .info { max-width: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>CONTACT&nbsp;<span class="brace">{</span></h1>

    <div class="grid">
      <!-- LEFT: info + links -->
      <section class="info">
        <h2>Have a project in mind?</h2>
        <p class="lead">My inbox is always open for new opportunities.</p>

        <nav class="links">
          <!-- Email -->
          <a href="mailto:noahkim623@gmail.com">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m2 7 10 6 10-6"></path>
              </svg>
            </span>
            noahkim623@gmail.com
          </a>

          <!-- Phone -->
          <a href="tel:+19176125090">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"></path>
              </svg>
            </span>
            (917) 612-5090
          </a>
        </nav>
      </section>

      <!-- RIGHT: form -->
      <section>
        <form id="contactForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <p class="form-note" id="note" aria-live="polite"></p>

          <button type="submit">Submit</button>
        </form>
      </section>
    </div>
  </main>

  <script>
    // Static-friendly submit: validates, then opens the visitor's mail client
    // with a pre-filled message addressed to noahkim623@gmail.com.
    const TO = "noahkim623@gmail.com";
    const form = document.getElementById("contactForm");
    const note = document.getElementById("note");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!email || !subject || !message) {
        note.textContent = "Please fill in all fields.";
        note.classList.remove("show");
        return;
      }

      const body = "From: " + email + "\n\n" + message;
      const href =
        "mailto:" + TO +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      window.location.href = href;
      note.textContent = "Opening your email app…";
      note.classList.add("show");
    });
  </script>
</body>
</html>
